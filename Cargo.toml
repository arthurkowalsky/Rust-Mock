[package]
name = "RustMock"
version = "0.3.3"
edition = "2021"
authors = ["Arthur Kowalsky <arthurkowalsky@users.noreply.github.com>"]
description = "Lightning-fast, lightweight API mock server with OpenAPI support and beautiful React dashboard"
license = "MIT"
repository = "https://github.com/arthurkowalsky/Rust-Mock"
homepage = "https://github.com/arthurkowalsky/Rust-Mock"
documentation = "https://github.com/arthurkowalsky/Rust-Mock#readme"
readme = "README.md"
keywords = ["mock", "api", "openapi", "testing", "development"]
categories = ["development-tools", "web-programming", "command-line-utilities"]
exclude = [
    "ui/node_modules/**",
    "ui/dist/**",
    ".github/**",
    "images/**",
    "*.http",
]

[[bin]]
name = "RustMock"
path = "src/bin/server.rs"

[[bin]]
name = "mokku"
path = "src/bin/mokku.rs"

[dependencies]
actix-web = { version = "4.15", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-files = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
openapiv3 = "2.2"
clap = { version = "4.6", features = ["derive"] }
inquire = "0.9.4"
colored = "3.1.1"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
regex = "1.13"
log = "0.4"
anyhow = "1.0"
open = "5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
actix-rt = "2.15"
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
